name: sangam_dairy
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  http: ^1.5.0
  android_intent_plus: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/sangam_farm.png
    - assets/images/sangam_milk_collection.png
    - assets/images/sangam_dairy_products.png
    - assets/images/sangam_logo.png
    - assets/images/phonepe.png
    - assets/images/google_pay.png

    - assets/images/milk/
    - assets/images/milkproducts/
    - assets/images/sweets/
    - assets/images/drinks/
    - assets/images/savories/
    - assets/images/spieces/
    - assets/images/bakery/
    - assets/images/seeds/
    - assets/images/other_products/
